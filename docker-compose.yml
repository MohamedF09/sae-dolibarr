services:
  db:
    image: mariadb:10.11
    container_name: dolibarr_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dolibarr_net

  dolibarr:
    image: dolibarr/dolibarr:latest
    container_name: dolibarr_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      DOLI_DB_HOST: db
      DOLI_DB_NAME: ${DB_NAME}
      DOLI_DB_USER: ${DB_USER}
      DOLI_DB_PASSWORD: ${DB_PASSWORD}
      DOLI_ADMIN_LOGIN: ${DOLI_ADMIN_LOGIN}
      DOLI_ADMIN_PASSWORD: ${DOLI_ADMIN_PASSWORD}
      DOLI_URL_ROOT: ${DOLI_URL_ROOT:-http://localhost:8080}
      DOLI_INSTALL_AUTO: 1
      DOLI_INIT_DEMO: 0
      PHP_INI_DATE_TIMEZONE: Europe/Paris
    volumes:
      - dolibarr_documents:/var/www/documents
      - dolibarr_html_custom:/var/www/html/custom
    networks:
      - dolibarr_net

volumes:
  db_data:
  dolibarr_documents:
  dolibarr_html_custom:

networks:
  dolibarr_net:
    driver: bridge
